<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CFC Marchica · escena del vídeo del hero</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
/*
  La hora azul sobre la laguna Marchica: la carretera (gris), el resplandor del
  sol recién puesto detrás de la loma (ámbar) y la laguna (verde), como en el
  logo. Todo es periódico: tras T segundos la cámara ha recorrido L metros y el
  fotograma vuelve a ser el primero, así el vídeo se repite sin corte.

  Uso: escena.html?w=1920&h=1080   → window.renderFrame(t) devuelve un JPEG.
       escena.html?preview=1       → animación en tiempo real.
*/
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const q = new URLSearchParams(location.search);
const W = +q.get("w") || 1280, H = +q.get("h") || 720;
const PORTRAIT = H > W;

const T = 12;      // segundos por bucle
const L = 200;     // metros por bucle
const TAU = Math.PI * 2;
const LANE = 1.9;  // centro del carril derecho

/* ---------- trazado de la carretera ---------- */
const A1 = 3.2, A2 = 1.0;
const roadX = s => A1 * Math.sin(TAU * s / L) + A2 * Math.sin(2 * TAU * s / L + 0.8);
const roadDX = s => A1 * (TAU / L) * Math.cos(TAU * s / L) + A2 * (2 * TAU / L) * Math.cos(2 * TAU * s / L + 0.8);
function onRoad(s, d, y = 0) {
  const k = roadDX(s), n = Math.sqrt(1 + k * k);
  return new THREE.Vector3(roadX(s) + d / n, y, -(s - d * k / n));
}
const f3 = v => v.toFixed(4);
const GLSL_ROAD = `
  const float TAU = 6.28318530718;
  float roadX(float s){ return ${f3(A1)}*sin(TAU*s/${f3(L)}) + ${f3(A2)}*sin(2.0*TAU*s/${f3(L)}+0.8); }
  float roadDX(float s){ return ${f3(A1)}*(TAU/${f3(L)})*cos(TAU*s/${f3(L)}) + ${f3(A2)}*(2.0*TAU/${f3(L)})*cos(2.0*TAU*s/${f3(L)}+0.8); }
`;

/* ---------- color ---------- */
const C = hex => new THREE.Color(hex);
const PAL = {
  zenith: C("#05202a"),
  upper: C("#0f5561"),
  horizon: C("#a87766"),
  glow: C("#ef9440"),     // ámbar del logo
  sun: C("#ffd29a"),
  fog: C("#4f5960"),
  water: C("#0f3f3a"),    // verde laguna en sombra
  asphalt: C("#2c2e31"),
  paint: C("#c4bfb5"),
  ground: C("#4a4136"),
  scrub: C("#2c3123"),
  promenade: C("#514b44"),
  lamp: C("#ffb15c"),
};
// el sol acaba de ponerse detrás de la loma, un poco a la derecha
const SUN_DIR = new THREE.Vector3(0.11, -0.012, -1).normalize();
const FOG_DENSITY = 0.0011;

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(PAL.fog, FOG_DENSITY);
const camera = new THREE.PerspectiveCamera(PORTRAIT ? 64 : 40, W / H, 0.1, 9000);

/* ---------- cielo (GLSL compartido) ---------- */
const GLSL_SKY = `
  uniform vec3 uZenith, uUpper, uHorizon, uGlow, uSun, uSunDir;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
    return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
  }
  vec3 skyColor(vec3 dir){
    float e = dir.y;
    float az = max(dot(normalize(dir.xz + 1e-5), normalize(uSunDir.xz)), 0.0);
    float ep = max(e, 0.0);
    vec3 col = mix(uHorizon, uUpper, smoothstep(0.0, 0.2, e));
    col = mix(col, uZenith, smoothstep(0.16, 0.7, e));
    float glow = pow(az, 3.0) * exp(-ep * 8.0);
    col = mix(col, uGlow, clamp(glow, 0.0, 1.0) * 0.9);
    col += uSun * pow(az, 40.0) * exp(-ep * 34.0) * 1.7;
    // nubes finas iluminadas desde abajo
    if (e > 0.0) {
      vec2 uv = dir.xz / (e + 0.06);
      float n = vnoise(uv * vec2(0.7, 4.5)) * 0.6 + vnoise(uv * vec2(1.9, 10.0)) * 0.4;
      float band = smoothstep(0.03, 0.07, e) * (1.0 - smoothstep(0.1, 0.2, e));
      float cl = smoothstep(0.56, 0.86, n) * band;
      vec3 under = mix(vec3(0.16, 0.18, 0.22), vec3(0.95, 0.48, 0.30), pow(az, 4.0));
      col = mix(col, under, cl * 0.6);
    }
    if (e < 0.0) col = mix(col, uHorizon * 0.55, smoothstep(0.0, -0.08, e));
    return col;
  }
`;
const skyUniforms = {
  uZenith: { value: PAL.zenith }, uUpper: { value: PAL.upper }, uHorizon: { value: PAL.horizon },
  uGlow: { value: PAL.glow }, uSun: { value: PAL.sun }, uSunDir: { value: SUN_DIR },
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(7000, 48, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { ...skyUniforms },
    vertexShader: `varying vec3 vDir; void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vDir = wp.xyz - cameraPosition; gl_Position = projectionMatrix * viewMatrix * wp; }`,
    fragmentShader: `varying vec3 vDir; ${GLSL_SKY}
      void main(){
        vec3 d = normalize(vDir);
        vec3 col = skyColor(d);
        // unas pocas estrellas arriba
        vec2 g = floor(d.xz / (d.y + 0.2) * 260.0);
        float st = step(0.9965, hash(g)) * smoothstep(0.35, 0.8, d.y);
        col += vec3(0.9, 0.95, 1.0) * st * 0.6;
        gl_FragColor = vec4(col, 1.0);
      }`,
  })
);
sky.renderOrder = -10;
scene.add(sky);

/* ---------- lejos: montañas, loma del sol y luces de la otra orilla ---------- */
const far = new THREE.Group();
scene.add(far);
const rndS = (i, seed = 0) => { const x = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453; return x - Math.floor(x); };
function ridge({ dist, from, to, base, amp, seed, color, steps = 240, freq = 1, shape = null }) {
  const pos = [], idx = [];
  const noise = t => {
    let v = 0, a = 1, f = freq, sum = 0;
    for (let o = 0; o < 5; o++) {
      const x = t * f + seed * 10 + o * 3.1, i = Math.floor(x), fr = x - i, u = fr * fr * (3 - 2 * fr);
      v += a * (rndS(i, seed) * (1 - u) + rndS(i + 1, seed) * u); sum += a; a *= 0.5; f *= 2.1;
    }
    return v / sum;
  };
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, az = THREE.MathUtils.degToRad(from + (to - from) * t);
    const x = Math.sin(az) * dist, z = -Math.cos(az) * dist;
    const h = shape ? shape(t) : base + amp * Math.pow(Math.sin(Math.PI * t), 0.6) * noise(t * 6);
    pos.push(x, -80, z, x, h, z);
    if (i < steps) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  far.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, fog: false, side: THREE.DoubleSide })));
}
// el Gourougou en capas, a la izquierda
ridge({ dist: 5400, from: -100, to: 0, base: 12, amp: 330, seed: 1, color: C("#5d5662") });
ridge({ dist: 4300, from: -104, to: -10, base: 6, amp: 230, seed: 2, color: C("#3f3d48") });
ridge({ dist: 3100, from: -108, to: -22, base: 0, amp: 140, seed: 3, color: C("#2b2b33") });
// la loma redonda delante del sol, como en el logo
const sunAz = Math.atan2(SUN_DIR.x, -SUN_DIR.z) * 180 / Math.PI;
ridge({ dist: 5000, from: sunAz - 10, to: sunAz + 9, color: C("#4a3a3c"), steps: 160,
  shape: t => 6 + 175 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.05)), 1.7) });
// la barra arenosa al otro lado de la laguna
ridge({ dist: 5600, from: sunAz + 6, to: 80, base: 2, amp: 26, seed: 5, color: C("#4c4446"), freq: 0.5 });

const dotTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d");
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.2, "rgba(255,255,255,0.9)");
  r.addColorStop(0.5, "rgba(255,255,255,0.2)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
(function shoreLights() {
  // luces de Nador y de la otra orilla, con su reflejo alargado en el agua
  for (let i = 0; i < 70; i++) {
    const az = THREE.MathUtils.degToRad(sunAz + 9 + rndS(i, 7) * 62);
    const dist = 5300 - rndS(i, 8) * 1200;
    const warm = rndS(i, 9) > 0.25;
    const col = warm ? 0xffb066 : 0xdfe8ff;
    const y = 4 + rndS(i, 10) * 10;
    const mat = new THREE.SpriteMaterial({ map: dotTex, color: col, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, opacity: 0.9 });
    const sp = new THREE.Sprite(mat);
    sp.position.set(Math.sin(az) * dist, y, -Math.cos(az) * dist);
    sp.scale.setScalar(9 + rndS(i, 11) * 9);
    far.add(sp);
    const refl = new THREE.Sprite(mat.clone());
    refl.material.opacity = 0.32;
    refl.position.set(Math.sin(az) * dist * 0.985, -22, -Math.cos(az) * dist * 0.985);
    refl.scale.set(7, 70, 1);
    far.add(refl);
  }
})();

/* ---------- suelo: carretera, arcén, paseo y tierra en un solo shader ---------- */
const groundUniforms = {
  ...skyUniforms,
  uAsphalt: { value: PAL.asphalt }, uPaint: { value: PAL.paint }, uGround: { value: PAL.ground },
  uScrub: { value: PAL.scrub }, uPromenade: { value: PAL.promenade }, uFog: { value: PAL.fog },
  uLamp: { value: PAL.lamp }, uCamS: { value: 0 },
};
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(9000, 9000, 1, 1).rotateX(-Math.PI / 2),
  new THREE.ShaderMaterial({
    uniforms: groundUniforms,
    vertexShader: `varying vec3 vW; void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vW = wp.xyz; gl_Position = projectionMatrix*viewMatrix*wp; }`,
    fragmentShader: `
      varying vec3 vW;
      uniform vec3 uAsphalt, uPaint, uGround, uScrub, uPromenade, uFog, uLamp;
      uniform float uCamS;
      ${GLSL_ROAD}
      ${GLSL_SKY}
      float band(float x, float a, float b){ float w = fwidth(x)*1.2; return smoothstep(a-w, a+w, x) - smoothstep(b-w, b+w, x); }
      void main(){
        float s = -vW.z;
        float k = roadDX(s);
        float d = (vW.x - roadX(s)) / sqrt(1.0 + k*k);
        if (d > 14.0) discard;               // a partir de aquí, agua
        vec3 V = normalize(cameraPosition - vW);
        float dist = length(cameraPosition - vW);
        float n1 = vnoise(vW.xz * 0.07), n2 = vnoise(vW.xz * 0.7);
        vec3 col = mix(uGround, uScrub, smoothstep(0.5, 0.8, n1) * 0.9) * (0.8 + 0.3 * n2);
        float shoulder = band(abs(d), 4.0, 4.9);
        col = mix(col, uAsphalt * 1.35 * (0.85 + 0.3 * n2), shoulder);
        float prom = band(d, 5.2, 14.0);
        float tiles = smoothstep(0.93, 0.98, fract(s / 1.5)) * 0.3 * (1.0 - smoothstep(25.0, 80.0, dist));
        col = mix(col, uPromenade * (1.0 - tiles) * (0.9 + 0.15 * n2), prom);
        col = mix(col, uPaint * 0.75, band(d, 4.9, 5.2));
        float road = band(d, -4.0, 4.0);
        float wear = 1.0 - 0.15 * band(abs(abs(d) - 1.9), 0.4, 1.0);
        col = mix(col, uAsphalt * (0.88 + 0.2 * n2) * wear, road);
        float dash = band(abs(d), 0.0, 0.075) * step(fract(s / 10.0), 0.32);
        float edges = band(abs(d), 3.72, 3.86);
        col = mix(col, uPaint, clamp(dash + edges, 0.0, 1.0) * road);
        float spec = road + shoulder * 0.4 + prom * 0.5;

        // luz ambiente del cielo + resplandor del poniente
        vec3 lit = col * (vec3(0.30, 0.38, 0.44) * 0.95);
        vec3 R = reflect(-V, vec3(0.0, 1.0, 0.0));
        float sheen = pow(max(dot(normalize(vec3(R.x, max(R.y, 0.0), R.z)), normalize(vec3(uSunDir.x, 0.02, uSunDir.z))), 0.0), 18.0);
        lit += uGlow * sheen * 0.12 * spec;
        lit += skyColor(R) * 0.06 * spec;

        // farolas cada 40 m sobre el borde derecho
        float ph = mod(s - 15.0, 40.0);
        float ds = min(ph, 40.0 - ph);
        float pool = exp(-(ds*ds + (d - 4.0)*(d - 4.0)) / 46.0);
        lit += col * uLamp * pool * 1.8 + uLamp * pool * spec * 0.025;

        // nuestros faros: cono en el carril por delante
        float rel = s - uCamS;
        float spread = 1.3 + rel * 0.07;
        float beam = smoothstep(2.0, 7.0, rel) * (1.0 - smoothstep(22.0, 60.0, rel)) * exp(-pow((d - ${f3(LANE)}) / spread, 2.0));
        lit += col * vec3(1.0, 0.95, 0.85) * beam * 1.5 + vec3(0.9, 0.85, 0.75) * beam * spec * 0.012;

        float f = 1.0 - exp(-${(FOG_DENSITY * FOG_DENSITY).toFixed(10)} * dist * dist);
        vec3 fogCol = mix(uFog, uGlow, pow(max(dot(-V, normalize(vec3(uSunDir.x, 0.0, uSunDir.z))), 0.0), 8.0) * 0.55);
        gl_FragColor = vec4(mix(lit, fogCol, f), 1.0);
      }
    `,
  })
);
scene.add(ground);

/* ---------- laguna ---------- */
const waves = [];
(function makeWaves() {
  const zs = [13, 23, 37, 53, 71, 97, 131, 173, 229, 307, 401, 521];
  zs.forEach((n, i) => {
    const kz = TAU * n / L;
    const kx = kz * (0.25 + 1.1 * Math.abs(Math.sin(i * 2.31 + 0.7))) * (i % 2 ? 1 : -1);
    const kk = Math.hypot(kx, kz);
    const amp = 0.075 / kk;
    const m = Math.max(1, Math.round(Math.sqrt(9.8 * kk) * T / TAU * 0.3));
    waves.push(new THREE.Vector4(kx, kz, amp, TAU * m / T));
  });
})();
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(9000, 9000, 1, 1).rotateX(-Math.PI / 2),
  new THREE.ShaderMaterial({
    uniforms: { ...skyUniforms, uTime: { value: 0 }, uWater: { value: PAL.water }, uFog: { value: PAL.fog }, uWaves: { value: waves }, uLamp: { value: PAL.lamp }, uCamS: { value: 0 } },
    vertexShader: `varying vec3 vW; void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vW = wp.xyz; gl_Position = projectionMatrix*viewMatrix*wp; }`,
    fragmentShader: `
      varying vec3 vW;
      uniform float uTime, uCamS;
      uniform vec3 uWater, uFog, uLamp;
      uniform vec4 uWaves[${waves.length}];
      ${GLSL_ROAD}
      ${GLSL_SKY}
      void main(){
        float dist = length(cameraPosition - vW);
        vec2 g = vec2(0.0);
        for (int i = 0; i < ${waves.length}; i++) {
          vec4 w = uWaves[i];
          float kk = length(w.xy);
          float fade = 1.0 - smoothstep(0.25, 1.0, dist * kk / 260.0);
          float ph = w.x * vW.x + w.y * vW.z + w.w * uTime + float(i) * 1.7;
          g += w.z * w.xy * cos(ph) * fade;
        }
        vec3 N = normalize(vec3(-g.x, 1.0, -g.y));
        vec3 V = normalize(cameraPosition - vW);
        float fres = 0.04 + 0.96 * pow(1.0 - max(dot(N, V), 0.0), 5.0);
        vec3 R = reflect(-V, N); R.y = abs(R.y);
        vec3 col = mix(uWater * 0.55, skyColor(R), fres);
        // camino de luz hacia el resplandor del poniente
        float az = max(dot(normalize(R.xz), normalize(uSunDir.xz)), 0.0);
        col += uSun * pow(az, 220.0) * smoothstep(0.08, 0.0, R.y) * 1.2;
        // reflejo de las farolas del paseo
        float s = -vW.z;
        float k = roadDX(s);
        float d = (vW.x - roadX(s)) / sqrt(1.0 + k*k);
        float ph = mod(s - 15.0, 40.0);
        float ds = min(ph, 40.0 - ph);
        float lampR = exp(-ds*ds / 3.0) * exp(-max(d - 14.0, 0.0) / 9.0) * (0.6 + 0.8 * fres);
        col += uLamp * lampR * 0.5 * (0.6 + 0.4 * sin(g.x * 40.0));
        float f = 1.0 - exp(-${(FOG_DENSITY * FOG_DENSITY * 0.6).toFixed(10)} * dist * dist);
        vec3 fogCol = mix(uFog, uGlow, pow(max(dot(-V, normalize(vec3(uSunDir.x, 0.0, uSunDir.z))), 0.0), 8.0) * 0.55);
        gl_FragColor = vec4(mix(col, fogCol, f), 1.0);
      }
    `,
  })
);
water.position.y = -0.55;
scene.add(water);

/* ---------- luces para los objetos ---------- */
scene.add(new THREE.HemisphereLight(0x5b7a86, 0x241e1a, 0.75));
const rim = new THREE.DirectionalLight(0xffa35a, 0.9);
scene.add(rim, rim.target);

/* ---------- muro de la laguna ---------- */
(function seawall() {
  const pos = [], idx = [];
  const s0 = -60, s1 = 1700, step = 2;
  let i = 0;
  for (let s = s0; s <= s1; s += step, i++) {
    const top = onRoad(s, 14.0, 0.02), bot = onRoad(s, 14.0, -0.6);
    pos.push(top.x, top.y, top.z, bot.x, bot.y, bot.z);
    if (s + step <= s1) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x6a6258, roughness: 0.9, side: THREE.DoubleSide })));
})();

/* ---------- palmeras del paseo ---------- */
const rnd = i => { const x = Math.sin(i * 91.345 + 3.7) * 47453.5453; return x - Math.floor(x); };
function palmGeometry() {
  const parts = [];
  const trunkH = 9;
  const trunk = new THREE.CylinderGeometry(0.16, 0.3, trunkH, 7, 10, true);
  const p = trunk.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) + trunkH / 2;
    p.setX(i, p.getX(i) + Math.pow(y / trunkH, 2) * 0.9);
    p.setY(i, y);
  }
  trunk.deleteAttribute("uv");
  trunk.computeVertexNormals();
  const paint = (g, c) => g.setAttribute("color", new THREE.Float32BufferAttribute(Array.from({ length: g.attributes.position.count * 3 }, (_, j) => c[j % 3]), 3));
  paint(trunk, [0.22, 0.18, 0.14]);
  parts.push(trunk.toNonIndexed());
  const fronds = 15;
  for (let f = 0; f < fronds; f++) {
    const len = 3.4 + (f % 4) * 0.45;
    const segs = 10;
    const pos = [], idx = [];
    for (let j = 0; j <= segs; j++) {
      const t = j / segs;
      const w = (Math.sin(Math.PI * Math.min(1, t * 1.1)) * 0.75 + 0.04) * (0.85 + 0.3 * ((j * 7) % 3) / 2);
      const droop = f < 5 ? 0.7 : 1.0;
      const x = t * len, y = Math.sin(t * Math.PI * 0.5) * 1.0 * droop - t * t * 2.8 * droop;
      pos.push(x, y - 0.05, -w, x, y + 0.1, 0, x, y - 0.05, w);
      if (j < segs) {
        const a = j * 3;
        idx.push(a, a + 3, a + 1, a + 1, a + 3, a + 4, a + 1, a + 4, a + 2, a + 2, a + 4, a + 5);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.rotateZ(f < 5 ? 0.55 : (f % 3) * 0.1);
    g.rotateY(f / fronds * TAU * 1.0 + (f % 2) * 0.15);
    g.translate(0.9, trunkH, 0);
    g.computeVertexNormals();
    paint(g, [0.13, 0.17, 0.10]);
    parts.push(g.toNonIndexed());
  }
  return mergeGeometries(parts);
}
const palmList = [];
for (let s = -40; s < 1600; s += 20) palmList.push(s);
const palms = new THREE.InstancedMesh(palmGeometry(), new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, side: THREE.DoubleSide }), palmList.length);
palmList.forEach((s, i) => {
  const key = ((Math.round(s / 20) % 10) + 10) % 10;
  const p = onRoad(s + 7, 10.5 + rnd(key) * 1.5, 0);
  const sc = 0.85 + rnd(key + 20) * 0.35;
  palms.setMatrixAt(i, new THREE.Matrix4().compose(p, new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rnd(key + 40) * TAU, 0)), new THREE.Vector3(sc, sc, sc)));
});
scene.add(palms);

/* ---------- farolas ---------- */
const glowTex = (inner, mid) => {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d");
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(inner, "rgba(255,255,255,0.85)");
  r.addColorStop(mid, "rgba(255,255,255,0.18)"); r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
};
const lampTex = glowTex(0.1, 0.4), lightTex = glowTex(0.12, 0.35);
const sprite = (tex, color, size, opacity = 1) => {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity }));
  sp.scale.setScalar(size);
  return sp;
};
const poleGeo = mergeGeometries([
  new THREE.CylinderGeometry(0.07, 0.11, 9, 6).translate(0, 4.5, 0).toNonIndexed(),
  new THREE.BoxGeometry(2.2, 0.08, 0.08).translate(-1.05, 8.9, 0).toNonIndexed(),
  new THREE.BoxGeometry(0.7, 0.14, 0.3).translate(-2.0, 8.82, 0).toNonIndexed(),
]);
const lampList = [];
for (let s = -40; s < 1600; s += 40) lampList.push(s);
const poles = new THREE.InstancedMesh(poleGeo, new THREE.MeshStandardMaterial({ color: 0x2a2c2e, roughness: 0.6, metalness: 0.3 }), lampList.length);
lampList.forEach((s, i) => {
  const ls = s + 15;
  poles.setMatrixAt(i, new THREE.Matrix4().compose(onRoad(ls, 6.0, 0), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.atan(roadDX(ls)), 0)), new THREE.Vector3(1, 1, 1)));
  const halo = sprite(lampTex, PAL.lamp, 2.6, 0.4); halo.position.copy(onRoad(ls, 4.0, 8.68)); scene.add(halo);
  const core = sprite(lightTex, 0xfff0d8, 0.8, 1.0); core.position.copy(onRoad(ls, 4.0, 8.7)); scene.add(core);
});
scene.add(poles);

/* ---------- casas bajas de Nador a la izquierda, con ventanas encendidas ---------- */
(function town() {
  const per = [];
  for (let i = 0; i < 22; i++) {
    per.push({
      s: rnd(i + 100) * L,
      d: -(48 + rnd(i + 200) * 240),
      w: 8 + rnd(i + 300) * 12, h: 3.2 + Math.floor(rnd(i + 400) * 4) * 3.1, dp: 8 + rnd(i + 500) * 10,
      c: ["#6f6a63", "#625d58", "#57534f", "#77716a", "#5c5753"][i % 5],
    });
  }
  const boxes = [];
  for (let k = -1; k < 9; k++) per.forEach((b, j) => boxes.push({ ...b, s: b.s + k * L, j }));
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0), new THREE.MeshStandardMaterial({ roughness: 0.95 }), boxes.length);
  const wins = [];
  boxes.forEach((b, i) => {
    const yaw = Math.atan(roadDX(b.s)) + (rnd(b.j) - 0.5) * 0.15;
    const p = onRoad(b.s, b.d, 0);
    mesh.setMatrixAt(i, new THREE.Matrix4().compose(p, new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0)), new THREE.Vector3(b.w, b.h, b.dp)));
    mesh.setColorAt(i, C(b.c));
    const floors = Math.round(b.h / 3.1);
    for (let fl = 0; fl < floors; fl++) for (let c = 0; c < 3; c++) {
      if (rnd(b.j * 31 + fl * 7 + c * 3) > 0.42) continue;
      wins.push({ p, yaw, x: b.w / 2 + 0.02, y: 1.3 + fl * 3.1, z: (c - 1) * b.dp * 0.28, warm: rnd(b.j + fl + c) > 0.2 });
    }
  });
  scene.add(mesh);
  const wm = new THREE.InstancedMesh(new THREE.PlaneGeometry(1.1, 1.3).rotateY(Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff }), wins.length);
  wins.forEach((w, i) => {
    const m = new THREE.Matrix4().makeRotationY(w.yaw).setPosition(w.p);
    m.multiply(new THREE.Matrix4().makeTranslation(w.x, w.y, w.z));
    wm.setMatrixAt(i, m);
    wm.setColorAt(i, w.warm ? new THREE.Color(2.4, 1.45, 0.6) : new THREE.Color(1.2, 1.5, 1.9));
  });
  scene.add(wm);
  const bushes = [];
  for (let i = 0; i < 46; i++) bushes.push({ s: rnd(i + 900) * L, d: -(6 + Math.pow(rnd(i + 950), 1.4) * 70), r: 0.25 + rnd(i + 990) * 0.5 });
  const all = [];
  for (let k = -1; k < 9; k++) bushes.forEach(b => all.push({ ...b, s: b.s + k * L }));
  const bm = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1).scale(1.4, 0.55, 1), new THREE.MeshStandardMaterial({ color: 0x23281b, roughness: 1, flatShading: true }), all.length);
  all.forEach((b, i) => bm.setMatrixAt(i, new THREE.Matrix4().compose(onRoad(b.s, b.d, b.r * 0.15), new THREE.Quaternion(), new THREE.Vector3(b.r, b.r, b.r))));
  scene.add(bm);
})();

/* ---------- vehículos ---------- */
const truck = new THREE.Group();
(function buildTruck() {
  const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.6 });
  truck.add(new THREE.Mesh(new THREE.BoxGeometry(2.5, 3.0, 12).translate(0, 2.1, -6), mat(0x8c8a86)));
  truck.add(new THREE.Mesh(new THREE.BoxGeometry(2.45, 2.7, 2.2).translate(0, 1.95, -13.4), mat(0x7d7b78)));
  truck.add(new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.5, 14).translate(0, 0.6, -7), mat(0x151515)));
  [-1.05, 1.05].forEach(x => {
    const tl = sprite(lightTex, 0xff2410, 1.5, 0.9); tl.position.set(x, 0.85, 0.2); truck.add(tl);
    const core = sprite(lightTex, 0xff7050, 0.4); core.position.set(x, 0.85, 0.21); truck.add(core);
  });
  for (let i = 0; i < 4; i++) [-1.27, 1.27].forEach(x => {
    const m = sprite(lightTex, 0xffa020, 0.45, 0.9); m.position.set(x, 0.9, -1.5 - i * 3.2); truck.add(m);
  });
  [-0.9, 0, 0.9].forEach(x => { const t = sprite(lightTex, 0xffa020, 0.3, 0.9); t.position.set(x, 3.55, 0.05); truck.add(t); });
})();
scene.add(truck);

const cars = [];
for (let i = 0; i < 4; i++) {
  const g = new THREE.Group();
  const col = [0x3a3d40, 0x1d2428, 0x5a1c19, 0x2a2d30][i];
  g.add(new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.75, 4.3).translate(0, 0.65, 0), new THREE.MeshStandardMaterial({ color: col, roughness: 0.4, metalness: 0.2 })));
  g.add(new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 2.2).translate(0, 1.3, 0.2), new THREE.MeshStandardMaterial({ color: 0x101315, roughness: 0.2 })));
  [-0.62, 0.62].forEach(x => {
    const h = sprite(lightTex, 0xfff1d8, 2.4, 0.85); h.position.set(x, 0.7, -2.25); g.add(h);
    const c = sprite(lightTex, 0xffffff, 0.6); c.position.set(x, 0.7, -2.26); g.add(c);
  });
  g.userData.phase = i * 100 + (i % 2) * 37;
  scene.add(g);
  cars.push(g);
}

/* ---------- postproceso ---------- */
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
composer.setPixelRatio(1);
composer.setSize(W, H);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.65, 0.5, 0.85));
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uAspect: { value: W / H } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uAspect; varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5;
      float r = length(c * vec2(uAspect, 1.0));
      vec2 off = c * 0.003 * r;
      vec3 col = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(col, col * vec3(0.9, 1.03, 1.06), (1.0 - l) * 0.4);   // sombras hacia el verde laguna
      col = mix(col, col * vec3(1.05, 1.0, 0.92), l * 0.3);           // luces hacia el ámbar
      col *= 1.0 - 0.32 * smoothstep(0.42, 1.05, r);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
}));

/* ---------- animación ---------- */
function update(t) {
  t = ((t % T) + T) % T;
  const s = L * t / T;
  const bob = 0.012 * Math.sin(TAU * 9 * t / T) + 0.007 * Math.sin(TAU * 23 * t / T + 1.3);
  const camH = PORTRAIT ? 1.75 : 1.62;
  const cam = onRoad(s, LANE, camH + bob);
  camera.position.copy(cam);
  // mirada algo alta: el horizonte queda bajo y el cielo oscuro arriba deja sitio al texto
  camera.lookAt(onRoad(s + 50, LANE - 0.25, PORTRAIT ? camH + 4.6 : camH + 2.4));
  const curv = (roadDX(s + 6) - roadDX(s - 6)) / 12;
  camera.rotateZ(-curv * 2.0 + 0.0012 * Math.sin(TAU * 5 * t / T));

  sky.position.copy(cam);
  far.position.set(cam.x, 0, cam.z);
  ground.position.set(cam.x, 0, cam.z);
  water.position.set(cam.x, -0.55, cam.z);
  water.material.uniforms.uTime.value = t;
  water.material.uniforms.uCamS.value = s;
  groundUniforms.uCamS.value = s;
  rim.position.copy(cam).addScaledVector(new THREE.Vector3(SUN_DIR.x, 0.08, SUN_DIR.z).normalize(), 100);
  rim.target.position.copy(cam);

  const ts = s + 78 + 4 * Math.sin(TAU * t / T);
  truck.position.copy(onRoad(ts, LANE, 0));
  truck.rotation.y = Math.atan(roadDX(ts));
  cars.forEach(car => {
    const rel = 360 - ((car.userData.phase + 2 * L * t / T) % 400);
    const cs = s + rel;
    car.position.copy(onRoad(cs, -LANE, 0));
    car.rotation.y = Math.atan(roadDX(cs)) + Math.PI;
    car.visible = rel > -20;
  });
}

window.renderFrame = function (t, quality = 0.93) {
  update(t);
  composer.render();
  return renderer.domElement.toDataURL("image/jpeg", quality);
};
window.sceneReady = true;

if (q.get("preview")) {
  const t0 = performance.now();
  (function loop() { update((performance.now() - t0) / 1000); composer.render(); requestAnimationFrame(loop); })();
} else {
  update(0); composer.render();
}
</script>
</body>
